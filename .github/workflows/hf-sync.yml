name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Run version update script
        run: |
          chmod +x scripts/update-version.sh
          ./scripts/update-version.sh

      - name: Commit version updates if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "chore: auto-update Dockerfile from VERSION.txt" && git push origin HEAD:${{ github.ref_name }})

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN is not set in GitHub Secrets."
            exit 1
          fi
          git push --force "https://ertugrulerata:$HF_TOKEN@huggingface.co/spaces/ertugrulerata/myHermes" HEAD:refs/heads/main
