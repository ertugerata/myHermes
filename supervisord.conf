[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dns-resolve]
command=python3 /home/user/app/scripts/dns-resolve.py /tmp/dns-resolved.json
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:github-restore]
command=bash /home/user/app/scripts/github-backup.sh restore
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:auth-config]
command=bash -c "cd /home/user/app && /opt/hermes/.venv/bin/python -c \"$(cat /home/user/app/scripts/auth-config.py)\""
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:hermes-dashboard]
command=/opt/hermes/.venv/bin/hermes dashboard --port 7860 --host 0.0.0.0 --no-open
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[program:hermes-tui-web]
command=/usr/local/bin/ttyd -p 7681 -W --reconnect 10 bash -c '/opt/hermes/.venv/bin/hermes --tui'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50

[program:backup-loop]
command=bash -c 'while true; do sleep 7200; bash /home/user/app/scripts/github-backup.sh backup; done'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=60
