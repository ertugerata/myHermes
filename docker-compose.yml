services:
  hermes:
    build: .
    container_name: hermes-agent
    env_file:
      - .env
    environment:
      - PDF_SUMMARIZER_LOCAL_READING_LIST=/home/user/app/Bilgi_Tabani/02_Okuma_Listesi
      - PDF_SUMMARIZER_LOCAL_SHELVES=/home/user/app/Bilgi_Tabani/03_Akilli_Raflar
    ports:
      - "${PORT:-7860}:${PORT:-7860}"
    volumes:
      - hermes-data:/home/user/.hermes
      - ./skills:/home/user/app/skills
      - ./buzz-skills:/home/user/app/buzz-skills
      - ./ofelia.conf:/home/user/app/ofelia.conf:ro
      - ${PDF_SUMMARIZER_LOCAL_READING_LIST:-./Bilgi_Tabani/02_Okuma_Listesi}:/home/user/app/Bilgi_Tabani/02_Okuma_Listesi
      - ${PDF_SUMMARIZER_LOCAL_SHELVES:-./Bilgi_Tabani/03_Akilli_Raflar}:/home/user/app/Bilgi_Tabani/03_Akilli_Raflar
    restart: always

volumes:
  hermes-data:
