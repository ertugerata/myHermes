services:
  hermes:
    build: .
    container_name: hermes-agent
    env_file:
      - .env
    ports:
      - "${PORT:-7860}:${PORT:-7860}"
    volumes:
      - hermes-data:/home/user/.hermes
      - ./skills:/home/user/app/skills
      - ./buzz-skills:/home/user/app/buzz-skills
      - ${PDF_SUMMARIZER_LOCAL_READING_LIST:-./Bilgi_Tabani/02_Okuma_Listesi}:${PDF_SUMMARIZER_LOCAL_READING_LIST:-/home/user/app/Bilgi_Tabani/02_Okuma_Listesi}
      - ${PDF_SUMMARIZER_LOCAL_SHELVES:-./Bilgi_Tabani/03_Akilli_Raflar}:${PDF_SUMMARIZER_LOCAL_SHELVES:-/home/user/app/Bilgi_Tabani/03_Akilli_Raflar}
    restart: always

  ofelia:
    image: mcuadros/ofelia:0.3.22
    container_name: ofelia-scheduler
    depends_on:
      - hermes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia.conf:/etc/ofelia/config.ini:ro
    restart: always

volumes:
  hermes-data:
